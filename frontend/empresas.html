<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vagas &amp; Carreiras &mdash; Empresas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="container">
    <h1>Empresas cadastradas</h1>

    <div id="alert-empresas" class="alert"></div>

    <form id="form-busca-empresas" class="filtros">
      <div class="row">
        <div class="six columns">
          <label for="busca-documento-empresa">Buscar por CPF do responsável ou CNPJ</label>
          <input type="text" id="busca-documento-empresa" name="documento" placeholder="CPF ou CNPJ" />
        </div>
        <div class="six columns">
          <label>&nbsp;</label>
          <button type="submit" class="button-primary">Buscar</button>
          <button type="reset" class="button">Limpar busca</button>
        </div>
      </div>
    </form>

    <div id="lista-empresas">
      <p class="estado-info">Carregando empresas...</p>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/empresas.js"></script>
</body>
</html>

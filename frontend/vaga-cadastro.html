<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vagas &amp; Carreiras &mdash; Cadastro de vaga</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="container">
    <h1>Cadastro de vaga</h1>

    <div id="alert-vaga" class="alert"></div>

    <form id="form-vaga" novalidate>
      <div class="row">
        <div class="eight columns">
          <label class="required" for="titulo">Título da vaga</label>
          <input type="text" id="titulo" name="titulo" maxlength="120" />
          <span class="campo-erro" id="erro-titulo">Informe o título da vaga.</span>
        </div>
        <div class="four columns">
          <label class="required" for="empresaId">Empresa responsável</label>
          <select id="empresaId" name="empresaId">
            <option value="">Carregando empresas...</option>
          </select>
          <span class="campo-erro" id="erro-empresaId">Selecione a empresa responsável.</span>
        </div>
      </div>

      <div class="row">
        <div class="twelve columns">
          <label class="required" for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" rows="4"></textarea>
          <span class="campo-erro" id="erro-descricao">Informe a descrição da vaga.</span>
        </div>
      </div>

      <div class="row">
        <div class="three columns">
          <label for="salario">Salário</label>
          <input type="number" id="salario" name="salario" min="0" step="0.01" />
        </div>
        <div class="three columns">
          <label class="required" for="modalidade">Modalidade</label>
          <select id="modalidade" name="modalidade">
            <option value="">Selecione</option>
            <option value="Presencial">Presencial</option>
            <option value="Hibrido">Híbrido</option>
            <option value="Remoto">Remoto</option>
          </select>
          <span class="campo-erro" id="erro-modalidade">Selecione a modalidade.</span>
        </div>
        <div class="three columns">
          <label class="required" for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" />
          <span class="campo-erro" id="erro-cidade">Informe a cidade da vaga.</span>
        </div>
        <div class="three columns">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="ABERTA">Aberta</option>
            <option value="FECHADA">Fechada</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="twelve columns">
          <label for="requisitos">Requisitos (separados por vírgula)</label>
          <input type="text" id="requisitos" name="requisitos" placeholder="Ex: Node.js, MongoDB, Git" />
        </div>
      </div>

      <button type="submit" class="button-primary">Publicar vaga</button>
      <button type="reset" class="button">Limpar</button>
    </form>
  </main>

  <div id="app-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/vaga-cadastro.js"></script>
</body>
</html>

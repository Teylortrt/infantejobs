<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vagas &amp; Carreiras &mdash; Cadastro de candidato</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="container">
    <h1>Cadastro de candidato</h1>

    <div id="alert-candidato" class="alert"></div>

    <form id="form-candidato" novalidate>
      <div class="row">
        <div class="six columns">
          <label class="required" for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" maxlength="120" />
          <span class="campo-erro" id="erro-nome">Informe o nome completo.</span>
        </div>
        <div class="six columns">
          <label class="required" for="email">E-mail</label>
          <input type="email" id="email" name="email" />
          <span class="campo-erro" id="erro-email">Informe um e-mail válido.</span>
        </div>
      </div>
      <div class="row">
        <div class="six columns">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" />
        </div>
        <div class="six columns">
          <label class="required" for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" />
          <span class="campo-erro" id="erro-cidade">Informe a cidade.</span>
        </div>
        <div class="six columns">
          <label class="required" for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" />
          <span class="campo-erro" id="erro-cpf">Informe o CPF.</span>
        </div>
      </div>
      <div class="row">
        <div class="twelve columns">
          <label for="habilidades">Habilidades (separadas por vírgula)</label>
          <input type="text" id="habilidades" name="habilidades" placeholder="Ex: JavaScript, Node.js, MongoDB" />
        </div>
      </div>
      <div class="row">
        <div class="twelve columns">
          <label for="curriculoUrl">URL do currículo (opcional)</label>
          <input type="url" id="curriculoUrl" name="curriculoUrl" placeholder="https://..." />
          <span class="campo-erro" id="erro-curriculoUrl">Informe uma URL válida.</span>
        </div>
      </div>

      <button type="submit" class="button-primary">Cadastrar candidato</button>
      <button type="reset" class="button">Limpar</button>
    </form>
  </main>

  <div id="app-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/candidato-cadastro.js"></script>
</body>
</html>
